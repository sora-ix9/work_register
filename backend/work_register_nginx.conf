# Copy this file to /etc/nginx/conf.d/ directory

server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate "/mnt/k/Computer Vision/personal project/work_register/backend/cert.pem";
    ssl_certificate_key "/mnt/k/Computer Vision/personal project/work_register/backend/key.pem";

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location /static/ {
        alias "/mnt/k/Computer Vision/personal project/work_register/backend/static/";
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:5000/socket.io;
        proxy_buffering off;
        proxy_http_version 1.1;        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   
    }

    location /pgadmin {
        proxy_pass http://127.0.0.1:8080;
    }
}